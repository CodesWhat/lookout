name: "CI"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'CI — Weekly schedule' ||
    github.event_name == 'pull_request' && format('CI — PR #{0}', github.event.pull_request.number) ||
    format('CI — {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  schedule:
    - cron: '30 6 * * 1'  # Weekly on Monday at 06:30 UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-ci:
    name: "Go CI"
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: CodesWhat/.github/.github/workflows/go-ci.yml@01bf40b06b110946f12a49b82e407d77c6480df7  # main, 2026-08-15
    with:
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      test-check-name: Build & Test
      lint-check-name: Lint
      fuzzers-json: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"name":"FuzzParsePHC","pkg":"./internal/server/"},{"name":"FuzzParseTrustedProxies","pkg":"./internal/server/"},{"name":"FuzzParseImageRef","pkg":"./internal/adapter/"},{"name":"FuzzParseLabels","pkg":"./internal/adapter/drydock/"},{"name":"FuzzMCPHandler","pkg":"./internal/mcp/"},{"name":"FuzzEnvelope","pkg":"./internal/protocol/"},{"name":"FuzzVerifyRequest","pkg":"./internal/auth/"},{"name":"FuzzDecodeContainerLogStream","pkg":"./internal/docker/"},{"name":"FuzzComposeRequestValidate","pkg":"./internal/docker/"},{"name":"FuzzParseKeyLine","pkg":"./internal/auth/"}]' || '[]' }}
      run-govulncheck: true
      run-qlty: ${{ github.event_name != 'schedule' }}
      run-goreleaser: ${{ github.event_name != 'schedule' }}
      run-workflow-security: true
      run-commit-message: true
      test-egress-policy: block
      test-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      lint-egress-policy: block
      lint-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      govulncheck-egress-policy: block
      govulncheck-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
        vuln.go.dev:443
      workflow-security-egress-policy: block
      workflow-security-allowed-endpoints: >-
        ghcr.io:443
        github.com:443
        pkg-containers.githubusercontent.com:443
      commit-message-egress-policy: block
      commit-message-allowed-endpoints: github.com:443
      goreleaser-egress-policy: block
      goreleaser-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      qlty-egress-policy: block
      qlty-allowed-endpoints: >-
        api.github.com:443
        api.osv.dev:443
        api.segment.io:443
        api0.prismacloud.io:443
        dl.google.com:443
        files.pythonhosted.org:443
        github-proxy.qlty.sh:443
        github.com:443
        go.dev:443
        mirror.gcr.io:443
        nodejs.org:443
        objects.githubusercontent.com:443
        proxy.golang.org:443
        pypi.org:443
        qlty-releases.s3.amazonaws.com:443
        radarlint-releases.s3.amazonaws.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
        tuf-repo-cdn.sigstore.dev:443
        tuf-repo.github.com:443
      fuzz-egress-policy: block
      fuzz-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        tmaproduction.blob.core.windows.net:443

  node-ci:
    name: "Node CI"
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    uses: CodesWhat/.github/.github/workflows/node-ci.yml@01bf40b06b110946f12a49b82e407d77c6480df7  # main, 2026-08-15
    with:
      node-version: 24
      lockfile-path: package-lock.json
      test-check-name: Web Contract
      run-test: true
      # run-lint and run-build stay off on purpose: "Web Contract" already
      # runs `npm run check:web`, which covers lint and build. Turning them on
      # would gate the same property twice.
      #
      # The names are set so they are right if those jobs are ever enabled.
      # They do NOT fix the cosmetic reporting: node-ci.yml declares both jobs
      # as `name: ${{ inputs.*-check-name }}` under `if: inputs.run-*`, and
      # GitHub does not evaluate an expression in a job's name when the job
      # skips. Passing the input explicitly changes nothing — measured on
      # PR #175, where the checks still reported as the literal
      # "Node CI / inputs.lint-check-name" with these very lines in place, and
      # upstream already defaults them to "Node Lint"/"Node Build" anyway.
      # Fixing it properly means a literal `name:` upstream in node-ci.yml.
      # Neither name is a required context, so nothing is gated on it.
      lint-check-name: Web Lint
      build-check-name: Web Build
      test-egress-policy: block
      test-allowed-endpoints: >-
        api.github.com:443
        fonts.googleapis.com:443
        fonts.gstatic.com:443
        github.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443

  codecov:
    name: "Coverage: Codecov Upload"
    needs: go-ci
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download Go test artifacts
        # go-ci's "test" job (Build & Test) uploads coverage.out from
        # artifacts/go-test/ under this name, always, even if a later step
        # in that job fails.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: go-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/go-test
        continue-on-error: true

      - name: Upload coverage to Codecov
        # Tokenless OIDC upload -- no CODECOV_TOKEN to store or rotate, and
        # skipped implicitly on fork PRs (no id-token grant). Non-gating by
        # design: the vendor-free coverage floor enforced in
        # scripts/ci/go-test.sh is the real gate, so a Codecov hiccup never
        # flakes the required "Build & Test" context.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: artifacts/go-test/coverage.out
          use_oidc: true
          fail_ci_if_error: false
        continue-on-error: true

  secrets:
    name: "Security: Secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore scanner policy from the base ref
        # A PR must not be able to alter the gate that scans it: restore the
        # scanner script and ignore policy from the protected base ref, so
        # policy changes only take effect after they merge.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
          git checkout FETCH_HEAD -- scripts/scan-secrets.sh .gitleaks.toml .gitleaksignore

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          "${install_dir}/gitleaks" version
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan secrets
        run: scripts/scan-secrets.sh

  codeql:
    name: "CodeQL Analysis"
    # Keep this job local: the explicit category preserves the default-branch
    # code-scanning identity while the organization workflow is canaried.
    if: github.event.repository.visibility == 'public' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          # One non-matrix job on purpose. A matrix appends the leg value to
          # the check-run name even with a single entry (drydock requires
          # "SAST: CodeQL (javascript-typescript)" for exactly this reason), so
          # a matrix here would post "CodeQL Analysis (go)" and never the bare
          # "CodeQL Analysis" this repo's ruleset requires, wedging every PR.
          # javascript-typescript extracts untraced alongside the traced Go
          # build below, with no npm install and no extra egress: the CodeQL
          # bundle ships every extractor. build-mode is deliberately unset --
          # codeql-action only accepts it for single-language jobs.
          languages: actions, go, javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Go
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: .github/workflows/ci.yml:codeql

  dependency-review:
    name: "Dependency Review"
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The first push that creates a dev/* branch reports github.event.before
      # as the all-zero SHA, which the compare API can't resolve, hard-failing
      # the job below. Fall back to the default branch in that case. BEFORE and
      # DEFAULT_BRANCH are env-passed rather than interpolated into the run:
      # script directly, since both come from event payload fields.
      - name: Resolve base ref
        id: base-ref
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="$DEFAULT_BRANCH"
          else
            base="$BEFORE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'push' && steps.base-ref.outputs.base || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  # scripts/package-release-config-test.sh is also run by release-cut.yml, and
  # that remains the gate that blocks a bad tag. The problem it doesn't solve is
  # timing: release-cut only runs when a tag is being cut, so a change that
  # breaks the contract stayed green from the PR that introduced it until
  # someone tried to ship, and the person who has to fix it is whoever is
  # mid-release rather than whoever wrote it.
  #
  # Deliberately carries no `if:` condition. A required context that evaluates
  # to skipped reports SKIPPED rather than success, and on a promotion PR the
  # push run and the PR run race to be last — which is how a required check
  # ended up blocking a merge here before. Always running is what keeps that
  # from recurring.
  release-contract:
    name: "Release Contract"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The contract script checks that every vX.Y.Z tag still has its
          # CHANGELOG heading and fails hard when it sees no tags at all, so
          # a shallow clone (which carries none) would fail this job on every
          # PR. Full depth brings the tags along.
          fetch-depth: 0

      # Pure grep/awk/shasum over files already in the checkout, so the only
      # network this job needs is the clone itself.
      - name: Verify the package release contract
        run: bash scripts/package-release-config-test.sh
